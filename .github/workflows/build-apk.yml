name: Build and publish Red TV Next
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a signed release after checks (requires original signing key)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon -PversionCode=$((100 + GITHUB_RUN_NUMBER)) -PbuildNumber=$GITHUB_RUN_NUMBER
      - uses: actions/upload-artifact@v4
        with:
          name: RedTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore original release signing identity
        env:
          KEYSTORE_B64: ${{ secrets.REDTV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.REDTV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REDTV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REDTV_KEY_PASSWORD }}
        shell: python
        run: |
          import base64, os, pathlib
          required = ('KEYSTORE_B64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          if not all(os.environ.get(k) for k in required):
              raise SystemExit('Missing release signing secrets. Supply the original key; do not generate a replacement.')
          pathlib.Path('release.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_B64'], validate=True))
          def escape(value):
              return ''.join('\\u%04x' % ord(c) for c in value)
          pathlib.Path('keystore.properties').write_text('storeFile=release.jks\n' + '\n'.join(
              key + '=' + escape(os.environ[env]) for key, env in
              [('storePassword', 'STORE_PASSWORD'), ('keyAlias', 'KEY_ALIAS'), ('keyPassword', 'KEY_PASSWORD')]
          ) + '\n', encoding='ascii')
      - name: Build signed release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=$((100 + GITHUB_RUN_NUMBER)) -PbuildNumber=$GITHUB_RUN_NUMBER
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Publish checked release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: b${{ github.run_number }}
          name: Red TV build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties release.jks
